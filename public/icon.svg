<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001f4d" />
      <stop offset="70%" stop-color="#000c1e" />
      <stop offset="100%" stop-color="#00050d" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle bezel -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#005bb5" stroke-width="8" />

  <!-- Outer HUD Circular Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#003875" stroke-width="4" stroke-dasharray="10 8" opacity="0.6" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.8" filter="url(#glow)" />

  <!-- Central Tachometer Arc -->
  <path d="M 120 320 A 155 155 0 1 1 392 320" fill="none" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 320 140 A 155 155 0 0 1 392 320" fill="none" stroke="#ff0055" stroke-width="14" stroke-linecap="round" />

  <!-- Stylized V8 Badge -->
  <g transform="translate(256, 240)">
    <!-- Equalizer Soundwaves -->
    <rect x="-85" y="20" width="10" height="45" rx="5" fill="#00f0ff" />
    <rect x="-65" y="-10" width="10" height="75" rx="5" fill="#00f0ff" />
    <rect x="-45" y="-40" width="10" height="105" rx="5" fill="#ffcc00" />
    <rect x="35" y="-40" width="10" height="105" rx="5" fill="#ffcc00" />
    <rect x="55" y="-10" width="10" height="75" rx="5" fill="#00f0ff" />
    <rect x="75" y="20" width="10" height="45" rx="5" fill="#00f0ff" />

    <!-- Big Center V8 Monogram -->
    <path d="M -30 -60 L 0 45 L 30 -60" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- 8 Rings -->
    <circle cx="0" cy="-25" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="10" />
    <circle cx="0" cy="20" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="10" />
  </g>

  <!-- Typography -->
  <text x="256" y="380" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    MOTOR SOUND
  </text>
  <text x="256" y="415" font-family="'Share Tech Mono', monospace" font-size="16" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="6">
    V8 INTERCONTINENTAL
  </text>
</svg>
